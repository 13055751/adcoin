name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu runner 预装完整 Android SDK；此处仅兜底补充 platform/build-tools。
      # 不使用 android-actions/setup-android（其安装废弃的 tools 包会在新版 runner 失败）。
      - name: Prepare Android SDK (best effort)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" || echo "components already present or install skipped"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: adcoin-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-plugin:
    name: Build Paper plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build plugin jar
        run: mvn -B -q clean package

      - uses: actions/upload-artifact@v4
        with:
          name: adcoin-plugin
          path: target/adcoin.jar
          if-no-files-found: error
