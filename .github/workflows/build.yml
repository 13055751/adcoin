name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apiBaseUrl:
        description: '后端地址（留空用默认 http://10.0.2.2:8787，例：http://1.2.3.4:8787）'
        required: false
        default: ''
      adMode:
        description: '广告模式：mock | admob | pangle（留空用 mock）'
        required: false
        default: ''
      admobAppId:
        description: 'AdMob App ID（如 ca-app-pub-xxx~yyy，写入 manifest）'
        required: false
        default: ''
      admobRewardedUnit:
        description: 'AdMob 激励广告位 ID'
        required: false
        default: ''

permissions:
  contents: write # 允许发布 Release（APK 镜像加速下载）

jobs:
  build-android:
    name: Build Android APK (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 用 flutter create 生成 android/ 脚手架（含 gradle wrapper），再覆盖我们的代码
      - name: Generate platform scaffolding
        run: flutter create --org com.adcoin --project-name adcoin --platforms android /tmp/gen

      - name: Overlay app code + patch android
        env:
          ADMOB_APP_ID: ${{ github.event.inputs.admobAppId }}
        run: |
          rm -rf /tmp/gen/lib
          cp -r flutter-app/lib /tmp/gen/lib
          cp flutter-app/pubspec.yaml /tmp/gen/pubspec.yaml
          bash flutter-app/ci/patch_android.sh /tmp/gen

      - name: Build debug APK
        working-directory: /tmp/gen
        env:
          IN_API_BASE: ${{ github.event.inputs.apiBaseUrl }}
          IN_AD_MODE: ${{ github.event.inputs.adMode }}
          IN_ADMOB_UNIT: ${{ github.event.inputs.admobRewardedUnit }}
        run: |
          flutter pub get
          DEFINES=""
          if [ -n "$IN_API_BASE" ]; then DEFINES="$DEFINES --dart-define=API_BASE_URL=$IN_API_BASE"; fi
          if [ -n "$IN_AD_MODE" ]; then DEFINES="$DEFINES --dart-define=AD_MODE=$IN_AD_MODE"; fi
          if [ -n "$IN_ADMOB_UNIT" ]; then DEFINES="$DEFINES --dart-define=ADMOB_REWARDED_UNIT=$IN_ADMOB_UNIT"; fi
          echo "dart-defines: $DEFINES"
          flutter build apk --debug $DEFINES

      - uses: actions/upload-artifact@v4
        with:
          name: adcoin-apk
          path: /tmp/gen/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      # 发布固定 tag 的 Release（public 仓库）→ 下载可走 gh-proxy 镜像加速
      - name: Publish latest-apk release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk -y || true
          gh release create latest-apk /tmp/gen/build/app/outputs/flutter-apk/*.apk \
            --title "Latest debug APK (CI ${{ github.run_id }})" \
            --latest \
            --notes "CI 构建产物。镜像加速下载：https://gh-proxy.com/https://github.com/${{ github.repository }}/releases/download/latest-apk/app-debug.apk"

  build-plugin:
    name: Build Paper plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build plugin jar
        run: mvn -B -q clean package

      - uses: actions/upload-artifact@v4
        with:
          name: adcoin-plugin
          path: target/adcoin.jar
          if-no-files-found: error
