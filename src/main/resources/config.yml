  usage-adcoin: "<gray>/adcoin <balance|give|take|set|top|unlink|reload></gray>"
  # ---- 好友社交 ----
  usage-friend: "<gray>/friend <list|pending|msg|transfer> — 好友列表 | 待处理请求 | 私聊 <player> <msg> | 转币 <player> <amount></gray>"
